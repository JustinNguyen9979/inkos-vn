name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, inkos-vn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate frontend localization and release scripts
        run: |
          pnpm --filter @actalk/inkos-studio exec node --import tsx ../../scripts/sync-vietnamese-catalog.ts --check
          pnpm audit:semantic-patterns
          node --test scripts/derive-inkos-vn-version.test.mjs
        shell: bash
      - name: Build, typecheck and unit test
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
        shell: bash
      - name: Stage and inspect npm packages
        run: |
          VERSION="0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          node scripts/stage-inkos-vn-packages.mjs --out .inkos-vn-release --version "$VERSION"
          node scripts/verify-staged-inkos-vn-packages.mjs --root .inkos-vn-release --version "$VERSION"
          for pkg in core studio cli; do npm pack ".inkos-vn-release/$pkg" --dry-run; done
        shell: bash

  studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @actalk/inkos-studio exec playwright install --with-deps chromium
      - run: pnpm --filter @actalk/inkos-studio test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-report
          path: packages/studio/playwright-report
          if-no-files-found: ignore
